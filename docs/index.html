<style>
/* Workbench: inputs left, live spring + charts center, results and checks right; the math opens in a drawer. */
:root {
  --bg: #ece9e4; --panel: #f8f6f3; --paper: #fcfbf9; --ink: #1d1a16; --ink-2: #514a41; --ink-3: #847b70;
  --line: #dcd5cb; --grid: rgba(60, 45, 20, 0.08);
  --accent: #b45309; --accent-soft: rgba(180, 83, 9, 0.11);
  --wire: #5b6470; --wire-hi: #9aa3ad; --force: #1d5fd1; --stress: #6d3fc4; --limit: #b42318; --solid: #847b70;
  --pass: #0f7a5c; --pass-soft: rgba(15, 122, 92, 0.1); --warn: #a15c00; --warn-soft: rgba(161, 92, 0, 0.12); --fail: #b42318; --fail-soft: rgba(180, 35, 24, 0.1);
  --sans: 'IBM Plex Sans', system-ui, sans-serif; --cond: 'IBM Plex Sans Condensed', var(--sans); --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100d; --panel: #1a1714; --paper: #15130f; --ink: #ece6dc; --ink-2: #b7ad9f; --ink-3: #7f766a; --line: #2e2923; --grid: rgba(255, 240, 210, 0.07);
    --accent: #f5a524; --accent-soft: rgba(245, 165, 36, 0.14); --wire: #aeb7c1; --wire-hi: #e3e8ee; --force: #6ea8ff; --stress: #b08cff; --limit: #ff7a6b; --solid: #8d8478;
    --pass: #3dd6a4; --pass-soft: rgba(61, 214, 164, 0.12); --warn: #f5a524; --warn-soft: rgba(245, 165, 36, 0.13); --fail: #ff7a6b; --fail-soft: rgba(255, 122, 107, 0.12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100d; --panel: #1a1714; --paper: #15130f; --ink: #ece6dc; --ink-2: #b7ad9f; --ink-3: #7f766a; --line: #2e2923; --grid: rgba(255, 240, 210, 0.07);
  --accent: #f5a524; --accent-soft: rgba(245, 165, 36, 0.14); --wire: #aeb7c1; --wire-hi: #e3e8ee; --force: #6ea8ff; --stress: #b08cff; --limit: #ff7a6b; --solid: #8d8478;
  --pass: #3dd6a4; --pass-soft: rgba(61, 214, 164, 0.12); --warn: #f5a524; --warn-soft: rgba(245, 165, 36, 0.13); --fail: #ff7a6b; --fail-soft: rgba(255, 122, 107, 0.12);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, select, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr); gap: 10px; height: 100dvh;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0; }
header > * { flex: none; }
header > .brand, header > #status { flex: 0 1 auto; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
h1 { font: 600 20px var(--cond); margin: 0; white-space: nowrap; }
#modelName { font: 13px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn.icon { padding: 6px 7px; }
.btn.small { padding: 4px 8px; font-size: 12px; }
#status { font: 500 12.5px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 5px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status.bad { color: var(--fail); background: var(--fail-soft); }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; z-index: 30; min-width: 220px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); }
.menu-pop button { display: flex; width: 100%; align-items: center; gap: 8px; background: none; border: 0; border-radius: 6px; padding: 7px 9px; cursor: pointer; text-align: left; }
.menu-pop button:hover { background: var(--accent-soft); }
.menu-pop svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-y: auto; min-width: 0; }
h2 { font: 600 11.5px var(--cond); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin: 16px 0 8px; }
h2:first-child { margin-top: 0; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 2px; width: 100%; }
.seg button { flex: 1; border: 0; background: none; border-radius: 6px; padding: 5px 6px; cursor: pointer; font: 500 12.5px var(--sans); color: var(--ink-2); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.field { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; color: var(--ink-2); }
.field > span:first-child { min-width: 0; }
.inp { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 0 8px; width: 138px; flex: none; }
.inp:focus-within { border-color: var(--accent); }
.inp input { border: 0; background: none; font: 13.5px var(--mono); width: 100%; padding: 5px 0; outline: none; min-width: 0; }
.inp em { font-style: normal; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.field select { width: 138px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 5px 6px; font-size: 13px; }
.field select.wide { width: 100%; }
.optn { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--ink-2); cursor: pointer; }
.optn input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.note { color: var(--ink-2); font-size: 13px; margin: 6px 0; }
.helper { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.helper .inp { width: 110px; }

.sheet { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 360px; display: flex; flex-direction: column; }
.sheetbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; flex-wrap: wrap; }

.checks { list-style: none; margin: 0; padding: 0; }

  display: flex; flex-direction: column; box-shadow: -16px 0 40px rgba(0, 0, 0, 0.14); transform: translateX(100%); transition: transform .22s ease; }

<script>
// Spring Bench — helical spring design (compression, extension, torsion). Pure functions, no DOM.
// Internal units: N, mm, MPa (N/mm²), N·mm, kg, Hz. The UI converts for US units.
// Method and constants follow Shigley's Mechanical Engineering Design (Budynas & Nisbett), ch. 10.
const Core = (() => {
  'use strict';

  // Minimum tensile strength Sut = A / d^m (MPa, d in mm). class: allowable-stress family.
  const MATERIALS = {
    A228: { name: 'Music wire (ASTM A228)', A: 2211, m: 0.145, E: 203400, G: 81700, rho: 7850, dmin: 0.10, dmax: 6.5, cls: 'cd' },
    A227: { name: 'Hard-drawn wire (A227)', A: 1783, m: 0.190, E: 197900, G: 80000, rho: 7850, dmin: 0.7, dmax: 12, cls: 'cd' },
    A229: { name: 'Oil-tempered wire (A229)', A: 1855, m: 0.187, E: 196500, G: 77200, rho: 7850, dmin: 0.5, dmax: 12, cls: 'ht' },
    A232: { name: 'Chrome-vanadium (A232)', A: 2005, m: 0.168, E: 203400, G: 77200, rho: 7850, dmin: 0.8, dmax: 11, cls: 'ht' },
    A401: { name: 'Chrome-silicon (A401)', A: 1974, m: 0.108, E: 203400, G: 77200, rho: 7850, dmin: 1.6, dmax: 9.5, cls: 'ht' },
    A313: { name: '302 stainless (A313)', A: 1867, m: 0.146, E: 193000, G: 69000, rho: 7920, dmin: 0.3, dmax: 2.5, cls: 'ss' },
    custom: { name: 'Custom (enter Sut, E, G)', A: 0, m: 0, E: 200000, G: 79000, rho: 7850, dmin: 0, dmax: Infinity, cls: 'cd' },
  };
  // Allowable stress as a fraction of Sut (Shigley tables 10-6 and 10-7, lower ends of the ranges).
  const ALLOW = {
    // compression, static: before / after set removal
    comp: { cd: [0.45, 0.60], ht: [0.50, 0.65], ss: [0.35, 0.55] },
    // extension: body torsion, hook torsion (B), hook bending (A)
    ext: { cd: [0.45, 0.40, 0.75], ht: [0.50, 0.40, 0.80], ss: [0.35, 0.30, 0.55] },
    // torsion springs: bending
    tor: { cd: 0.80, ht: 0.85, ss: 0.60 },
  };
  // End types: active-to-total coils, free length and solid height (Shigley table 10-1).
  const ENDS = {
    plain: { name: 'Plain', Ne: 0, Ls: (d, Nt) => d * (Nt + 1), L0: (p, d, Na) => p * Na + d, p: (L0, d, Na) => (L0 - d) / Na },
    plainGround: { name: 'Plain and ground', Ne: 1, Ls: (d, Nt) => d * Nt, L0: (p, d, Na) => p * (Na + 1), p: (L0, d, Na) => L0 / (Na + 1) },
    squared: { name: 'Squared (closed)', Ne: 2, Ls: (d, Nt) => d * (Nt + 1), L0: (p, d, Na) => p * Na + 3 * d, p: (L0, d, Na) => (L0 - 3 * d) / Na },
    sqGround: { name: 'Squared and ground', Ne: 2, Ls: (d, Nt) => d * Nt, L0: (p, d, Na) => p * Na + 2 * d, p: (L0, d, Na) => (L0 - 2 * d) / Na },
  };
  // Buckling end-condition constant α (Shigley table 10-2).
  const ALPHA = { fixedFixed: 0.5, fixedPinned: 0.707, pinnedPinned: 1, fixedFree: 2 };
  // Zimmerli fatigue data, d < 10 mm, all steels (MPa): [Ssa, Ssm]
  const ZIMMERLI = { unpeened: [241, 379], peened: [398, 534] };

  const wahl = C => (4 * C - 1) / (4 * C - 4) + 0.615 / C;
  const bergstrasser = C => (4 * C + 2) / (4 * C - 3);
  function strength(m) {
    const mat = MATERIALS[m.material] || MATERIALS.A228;
    if (m.material === 'custom') return { mat, Sut: +m.Sut || 0, E: +m.E || mat.E, G: +m.G || mat.G, rho: +m.rho || mat.rho };
    return { mat, Sut: mat.A / Math.pow(m.d, mat.m), E: mat.E, G: mat.G, rho: mat.rho };
  }
  // Gerber fatigue factor of safety on the load line through (τm, τa); Sse from Zimmerli, Ssu = 0.67 Sut.
  function gerber(ta, tm, Ssu, Sse) {
    if (ta <= 0) return { Sa: Infinity, Sm: tm, nf: Infinity };
    if (tm <= 0) return { Sa: Sse, Sm: 0, nf: Sse / ta };
    const r = ta / tm, Sa = r * r * Ssu * Ssu / (2 * Sse) * (-1 + Math.sqrt(1 + (2 * Sse / (r * Ssu)) ** 2));
    return { Sa, Sm: Sa / r, nf: Sa / ta };
  }
  function goodman(ta, tm, Ssu, SseG) { return { nf: 1 / (ta / SseG + tm / Ssu) }; }

  function fatigueBlock(m, Sut, Fa, Fm, toTau) {
    const [ZSa, ZSm] = m.peened ? ZIMMERLI.peened : ZIMMERLI.unpeened;
    const Ssu = 0.67 * Sut, Sse = ZSa / (1 - (ZSm / Ssu) ** 2), SseG = ZSa / (1 - ZSm / Ssu);
    const ta = toTau(Fa), tm = toTau(Fm), g = gerber(ta, tm, Ssu, Sse);
    return { ZSa, ZSm, Ssu, Sse, SseG, ta, tm, Sa: g.Sa, Sm: g.Sm, nf: g.nf, nfGoodman: goodman(ta, tm, Ssu, SseG).nf, valid: m.d < 10 };
  }

  function check(list, id, label, ok, detail, warn) { list.push({ id, label, status: ok ? 'pass' : warn ? 'warn' : 'fail', detail }); }

  function solve(m) {
    const d = +m.d, D = +m.D;
    if (!(d > 0) || !(D > d)) return { ok: false, message: 'Mean diameter must be larger than the wire diameter.' };
    const { mat, Sut, E, G, rho } = strength(m);
    if (!(Sut > 0)) return { ok: false, message: 'Enter the wire’s tensile strength.' };
    const C = D / d, KB = bergstrasser(C), KW = wahl(C), cls = mat.cls;
    const tauOf = F => KB * 8 * F * D / (Math.PI * d ** 3);
    const r = { ok: true, type: m.type, mat, Sut, E, G, rho, C, KB, KW, OD: D + d, ID: D - d, checks: [] };
    const ck = r.checks;
    check(ck, 'index', 'Spring index C between 4 and 12', C >= 4 && C <= 12, `C = ${C.toFixed(2)}`, C >= 3 && C <= 16);
    if (m.material !== 'custom') check(ck, 'wire', 'Wire size in the material’s range', d >= mat.dmin && d <= mat.dmax, `${mat.dmin}–${mat.dmax} mm`, true);

    if (m.type === 'compression') {
      const Na = +m.Na, ends = ENDS[m.ends] || ENDS.sqGround, Nt = Na + ends.Ne, L0 = +m.L0;
      const k = G * d ** 4 / (8 * D ** 3 * Na);
      const Ls = ends.Ls(d, Nt), p = ends.p(L0, d, Na), ys = L0 - Ls, Fs = k * ys;
      const Ssy = ALLOW.comp[cls][m.setRemoved ? 1 : 0] * Sut;
      Object.assign(r, { Na, Nt, k, L0, Ls, p, ys, Fs, Ssy, ends });
      if (!(ys > 0)) return { ok: false, message: 'Free length is shorter than the solid height: add length or remove coils.' };
      const pts = [['F₁', +m.F1], ['F₂', +m.F2]].map(([label, F]) => ({ label, F, y: F / k, L: L0 - F / k, tau: tauOf(F) }));
      r.points = pts;
      const F2 = Math.max(pts[0].F, pts[1].F), F1 = Math.min(pts[0].F, pts[1].F), y2 = F2 / k;
      r.tauS = tauOf(Fs); r.ns = Ssy / r.tauS; r.n2 = Ssy / tauOf(F2);
      r.xi = ys / y2 - 1;
      r.helix = Math.atan(p / (Math.PI * D)) * 180 / Math.PI;
      r.clash = (L0 - y2 - Ls) / Na;
      // buckling
      const alpha = ALPHA[m.endCond] || ALPHA.fixedFixed, lam = alpha * L0 / D;
      const C1 = E / (2 * (E - G)), C2 = 2 * Math.PI ** 2 * (E - G) / (2 * G + E);
      const Lcrit = Math.PI * D / alpha * Math.sqrt(2 * (E - G) / (2 * G + E));
      const yCr = C2 / lam ** 2 < 1 ? L0 * C1 * (1 - Math.sqrt(1 - C2 / lam ** 2)) : Infinity;
      r.buckling = { alpha, lam, C1, C2, Lcrit, yCr, absolute: L0 < Lcrit };
      // surge frequency and mass
      const massActive = rho * Math.PI ** 2 * d * d * D * Na / 4 * 1e-9; // kg
      r.mass = rho * Math.PI * d * d / 4 * Math.PI * D * Nt * 1e-9;
      r.wireLength = Math.PI * D * Nt;
      r.freq = (m.endCond === 'fixedFree' ? 0.25 : 0.5) * Math.sqrt(k * 1000 / massActive);
      r.massActive = massActive;
      check(ck, 'coils', 'Active coils between 3 and 15', Na >= 3 && Na <= 15, `Nₐ = ${+Na.toFixed(2)}`, Na >= 2);
      check(ck, 'solid', 'Survives being closed solid (nₛ ≥ 1.2)', r.ns >= 1.2, `nₛ = ${r.ns.toFixed(2)}`, r.ns >= 1);
      check(ck, 'work', 'Static stress at F₂ (n ≥ 1.2)', r.n2 >= 1.2, `n = ${r.n2.toFixed(2)}`, r.n2 >= 1);
      check(ck, 'overrun', 'Room before solid at F₂ (ξ ≥ 0.15)', r.xi >= 0.15, `ξ = ${r.xi.toFixed(2)}`, r.xi > 0);
      check(ck, 'buckle', 'Does not buckle at F₂', y2 < r.buckling.yCr, r.buckling.absolute ? 'absolutely stable' : `buckles at ${r.buckling.yCr.toFixed(1)} mm`);
      if (F2 > F1 && F1 >= 0) {
        r.fatigue = fatigueBlock(m, Sut, (F2 - F1) / 2, (F2 + F1) / 2, tauOf);
        check(ck, 'fatigue', 'Fatigue, Gerber (n_f ≥ 1.5)', r.fatigue.nf >= 1.5, `n_f = ${r.fatigue.nf.toFixed(2)}${r.fatigue.valid ? '' : ' (Zimmerli data is for d < 10 mm)'}`, r.fatigue.nf >= 1.1);
      }
      if (+m.opFreq > 0) check(ck, 'surge', 'Surge frequency ≥ 15× operating', r.freq >= 15 * m.opFreq, `${r.freq.toFixed(0)} Hz vs ${15 * m.opFreq} Hz`, r.freq >= 8 * m.opFreq);
      r.state = y => ({ y, L: L0 - y, F: k * y, tau: tauOf(k * y) });
      r.yMax = ys;
      return r;
    }

    if (m.type === 'extension') {
      const Nb = +m.Nb, Na = Nb + G / E, k = G * d ** 4 / (8 * D ** 3 * Na), Fi = +m.Fi || 0;
      const L0 = (2 * C - 1 + Nb) * d; // machine half-loops at both ends
      const r1 = +m.r1 || D / 2, r2 = +m.r2 || 2 * d, C1h = 2 * r1 / d, C2h = 2 * r2 / d;
      const KA = (4 * C1h * C1h - C1h - 1) / (4 * C1h * (C1h - 1)), KBh = (4 * C2h - 1) / (4 * C2h - 4);
      const sigA = F => F * (KA * 16 * D / (Math.PI * d ** 3) + 4 / (Math.PI * d * d));
      const tauB = F => KBh * 8 * F * D / (Math.PI * d ** 3);
      const [fb, fh, fa] = ALLOW.ext[cls];
      const Ssy = fb * Sut, SsyB = fh * Sut, SyA = fa * Sut;
      // preferred initial tension range (uncorrected stress, MPa)
      const tauI = 8 * Fi * D / (Math.PI * d ** 3), tauImid = 231 / Math.exp(0.105 * C), tauIband = 6.9 * (4 - (C - 3) / 6.5);
      const FiOf = t => t * Math.PI * d ** 3 / (8 * D);
      Object.assign(r, { Nb, Na, k, Fi, L0, Lbody: (Nb + 1) * d, r1, r2, C1h, C2h, KA, KBh, Ssy, SsyB, SyA, tauI, tauIrange: [tauImid - tauIband, tauImid + tauIband], FiRange: [FiOf(tauImid - tauIband), FiOf(tauImid + tauIband)] });
      const pts = [['F₁', +m.F1], ['F₂', +m.F2]].map(([label, F]) => ({ label, F, y: Math.max(0, F - Fi) / k, L: L0 + Math.max(0, F - Fi) / k, tau: tauOf(F), sigA: sigA(F), tauB: tauB(F) }));
      r.points = pts;
      const F2 = Math.max(pts[0].F, pts[1].F), F1 = Math.min(pts[0].F, pts[1].F);
      r.nBody = Ssy / tauOf(F2); r.nA = SyA / sigA(F2); r.nB = SsyB / tauB(F2);
      r.mass = rho * Math.PI * d * d / 4 * (Math.PI * D * Nb + 2 * Math.PI * D) * 1e-9;
      r.wireLength = Math.PI * D * (Nb + 2);

  // ---------- state slider ----------

  // Helix side view (compression/extension) or end view (torsion).
  function drawSpring(b) {

      ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx - l1, cy - R); ctx.stroke();

      ctx.fillStyle = css('--solid'); ctx.fillRect(cx - l1 - 6, cy - R - lw / 2 - 16, 6, 16 + lw);
      text('fixed leg', cx - l1, cy - R - lw / 2 - 26, { color: css('--ink-3'), font: '11px "IBM Plex Sans", sans-serif' });

        const ra = l2 * 0.85;
        ctx.strokeStyle = css('--accent'); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy, ra, Math.atan2(R, ra) , Math.atan2(R, ra) - th, true); ctx.stroke();
        const lm = Math.atan2(R, ra) - th / 2;
        text(`${num(s.deg, 3)}°`, cx + (ra + 22) * Math.cos(lm), cy + (ra + 22) * Math.sin(lm), { color: css('--accent'), font: '600 12px "IBM Plex Mono", monospace' });
      }
      // force at the leg tip, perpendicular, pushing it closed
      const tx = p1[0] - p0[0], ty = p1[1] - p0[1], tl = Math.hypot(tx, ty), nx = ty / tl, ny = -tx / tl;
      if (s.M > 0) arrow(p1[0] - nx * 44, p1[1] - ny * 44, p1[0] - nx * 6, p1[1] - ny * 6, css('--force'), 2, 8);
      text(`M = ${fu('M', s.M, 3)}`, b.x + 4, b.y + 14, { align: 'left', color: css('--force') });
      text(`coil ID ${fu('L', Dnow - d, 4)} (free ${fu('L', D - d, 4)})${+model.arbor > 0 ? `, arbor ${fu('L', +model.arbor, 3)}` : ''}`, b.x + 4, b.y + 32, { align: 'left', color: css('--ink-3') });

      ctx.beginPath(); ctx.arc(X(zEnd + d / 2) + R - lw / 2, cy, R, -Math.PI * 0.5, Math.PI * 1.5 - 0.6); ctx.stroke();
      arrow(X(D / 2) - 2 * R - 4, cy, X(D / 2) - 2 * R - 44, cy, css('--force'), 2);

  }

  // Chart definitions per spring type: x is deflection (or angle) unless noted.
  function chartList() {
    const t = model.type, list = [];
    const yMax = res.yMax, n = 80, xs = Array.from({ length: n + 1 }, (_, i) => yMax * i / n), states = xs.map(x => res.state(x));
    const Lk = t === 'torsion' ? null : 'L';

      pts: res.points.map(p => [p.y, p.tau, p.label]), limit: [res.Ssy, 'allowable'], slide: true });

  function niceStep(span, n) { const raw = span / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
  function drawChart(c, b) {

    let xMax, yMax, xs, ys, xf, yf;

      ctx.strokeStyle = css('--ink-3'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(f.Sm), Y(f.Sa)); ctx.stroke();
      ctx.fillStyle = css('--stress'); ctx.beginPath(); ctx.arc(X(f.tm), Y(f.ta), 5, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = css('--limit'); ctx.beginPath(); ctx.arc(X(f.Sm), Y(f.Sa), 3.5, 0, 2 * Math.PI); ctx.fill();
      text(`n_f = ${num(f.nf, 3)}`, X(f.tm) + 8, Y(f.ta) - 10, { align: 'left', color: css('--stress'), font: '600 12px "IBM Plex Mono", monospace' });
      text('Gerber', X(f.Ssu * 0.72) + 6, Y(f.Sse * (1 - 0.5184)), { align: 'left', color: css('--limit'), font: '11px "IBM Plex Sans", sans-serif' });

    text(`${c.xLabel}`, px + pw, py + ph + 26, { align: 'right', color: css('--ink-3'), font: '11px "IBM Plex Sans", sans-serif' });
    if (c.limit) {
      ctx.strokeStyle = css('--limit'); ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px, Y(c.limit[0])); ctx.lineTo(px + pw, Y(c.limit[0])); ctx.stroke(); ctx.setLineDash([]);
      text(c.limit[1], px + pw - 4, Y(c.limit[0]) - 9, { align: 'right', color: css('--limit'), font: '11px "IBM Plex Sans", sans-serif' });
    }
    if (c.vline) {
      ctx.strokeStyle = css('--fail'); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(c.vline[0]), py); ctx.lineTo(X(c.vline[0]), py + ph); ctx.stroke(); ctx.setLineDash([]);
      text(c.vline[1], X(c.vline[0]) + 4, py + 10, { align: 'left', color: css('--fail'), font: '11px "IBM Plex Sans", sans-serif' });
    }
    ctx.strokeStyle = css(c.color); ctx.lineWidth = 2; ctx.beginPath(); xs.forEach((x, i) => i ? ctx.lineTo(X(x), Y(ys[i])) : ctx.moveTo(X(x), Y(ys[i]))); ctx.stroke();
    for (const [x, y, l] of c.pts) {
      if (x > xMax * 1.0001) continue;
      ctx.fillStyle = l === 'solid' ? css('--solid') : css(c.color); ctx.beginPath(); ctx.arc(X(x), Y(y), 4, 0, 2 * Math.PI); ctx.fill();
      text(l, X(x) - 6, Y(y) - 10, { align: 'right', color: css('--ink-2'), font: '11px "IBM Plex Mono", monospace' });
    }
    // current state
    const s = curState(), sxv = model.type === 'torsion' ? s.deg : s.y, syv = c.id === 'force' ? (model.type === 'torsion' ? s.M : s.F) : (model.type === 'torsion' ? s.sigma : s.tau);
    ctx.strokeStyle = css('--accent'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(sxv) + 0.5, py); ctx.lineTo(X(sxv) + 0.5, py + ph); ctx.stroke();
    ctx.fillStyle = css('--accent'); ctx.beginPath(); ctx.arc(X(sxv), Y(syv), 4.5, 0, 2 * Math.PI); ctx.fill();
    if (c.slide) charts.push({ px, pw, py, ph, xMax });
  }
  // Hovering or dragging on a chart moves the spring to that deflection.
  cv.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const c = charts.find(q => x >= q.px && x <= q.px + q.pw && y >= q.py && y <= q.py + q.ph);
    if (!c || (e.pointerType === 'touch' && !e.pressure)) return;
    stateT = clamp((x - c.px) / c.pw * c.xMax / res.yMax, 0, 1); syncState(); draw();
  });

  // ---------- math drawer ----------
  let mathOpen = false;
  function renderMath() {
    $('#mathSub').textContent = model.name || '';
    const body = $('#mathBody'), wasOpen = [...body.querySelectorAll('details')].map(d => d.open);
    body.innerHTML = '';
    Explain.explain(model, res).forEach((s, i) => {
      const d = h('details', {}); d.open = wasOpen.length ? !!wasOpen[i] : i < 4;
      d.append(h('summary', { text: s.title }), h('div', { html: s.html })); body.append(d);
    });
  }
  function openMath() { mathOpen = true; renderMath(); $('#math').classList.add('open'); $('#math').setAttribute('aria-hidden', 'false'); $('#scrim').hidden = false; }
  function closeMath() { mathOpen = false; $('#math').classList.remove('open'); $('#math').setAttribute('aria-hidden', 'true'); $('#scrim').hidden = true; }
  $('#mathBtn').addEventListener('click', () => mathOpen ? closeMath() : openMath());
  $('#mathClose').addEventListener('click', closeMath); $('#scrim').addEventListener('click', closeMath);

  // ---------- files ----------
  async function offerFile(filename, data) {
    if (downloads) { try { await downloads.save({ filename, data }); toast(`Saved ${filename}.`); } catch (err) { if (!err || err.code !== 'declined') toast(`Could not save ${filename} here.`); } return; }
    if (window.claude && window.claude.use) { toast('Saving files is not available in this view.'); return; }
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }
  const fileSafe = s => (s || 'spring').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'spring';
  function specCSV() {
    if (!res.ok) return null;
    const rows = [['Spring Bench spec', model.name || ''], ['Type', model.type], ['Material', res.mat.name], ['Wire d', fu('L', model.d, 5)], ['Mean D', fu('L', model.D, 5)], ['OD', fu('L', res.OD, 5)], ['ID', fu('L', res.ID, 5)], ['Index C', num(res.C, 4)]];
    if (model.type === 'compression') rows.push(['Active coils', num(res.Na, 4)], ['Total coils', num(res.Nt, 4)], ['Ends', res.ends.name], ['Free length', fu('L', model.L0, 5)], ['Solid height', fu('L', res.Ls, 5)], ['Rate', fu('k', res.k, 5)]);
    if (model.type === 'extension') rows.push(['Body coils', num(res.Nb, 4)], ['Free length inside hooks', fu('L', res.L0, 5)], ['Initial tension', fu('F', res.Fi, 4)], ['Rate', fu('k', res.k, 5)]);
    if (model.type === 'torsion') rows.push(['Body coils', num(res.Nb, 4)], ['Legs', `${fu('L', model.L1, 4)} / ${fu('L', model.L2, 4)}`], ['Rate', fu('kt', res.kDeg, 5)]);
    for (const p of res.points) rows.push([`At ${p.label}`, model.type === 'torsion' ? `${fu('M', p.M, 4)}, ${num(p.deg, 4)}°, σ ${fu('S', p.sigma, 4)}` : `${fu('F', p.F, 4)}, length ${fu('L', p.L, 5)}, τ ${fu('S', p.tau, 4)}`]);
    for (const c of res.checks) rows.push([`Check: ${c.label}`, `${c.status} (${c.detail})`]);
    return rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  }
  const fileMenu = $('#fileMenu');
  $('#fileBtn').addEventListener('click', e => { e.stopPropagation(); fileMenu.hidden = !fileMenu.hidden; });
  addEventListener('click', () => { fileMenu.hidden = true; });
  fileMenu.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; fileMenu.hidden = true;
    ({ open: () => $('#fileIn').click(), save: () => offerFile(fileSafe(model.name) + '.json', JSON.stringify(model, null, 1)),
      csv: () => { const c = specCSV(); if (c) offerFile(fileSafe(model.name) + '-spec.csv', c); else toast('Fix the design first.'); },
      png: () => cv.toBlob(bl => bl && offerFile(fileSafe(model.name) + '.png', bl), 'image/png') })[b.dataset.act]();
  });
  $('#fileIn').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const m = JSON.parse(await f.text()); if (!m.type || !(m.d > 0)) throw new Error('not a Spring Bench design'); undoStack.push(JSON.stringify(model)); model = m; update(); toast(`Opened ${f.name}.`); }
    catch (err) { toast(`Could not open ${f.name}: ${err.message}.`); }
  });
  const presetSel = $('#presetSel');
  for (const [k, t] of Object.entries(Presets.titles)) presetSel.appendChild(h('option', { value: k, text: t }));
  presetSel.addEventListener('change', () => { const k = presetSel.value; presetSel.value = ''; if (!k) return; undoStack.push(JSON.stringify(model)); const u = model.units; model = Presets.list[k](); model.units = u; stateT = 0.6; update(); toast(`Loaded ${Presets.titles[k]}. Undo brings back your previous design.`); });

  // ---------- McMaster import ----------
  const dlg = $('#mmDialog'); let mmParsed = null;
  function openImport(pn) {
    pn = (pn || '').trim().toUpperCase();
    const link = $('#mmLink'); link.href = /^\d{4,5}[A-Z]\d{1,4}$/.test(pn) ? `https://www.mcmaster.com/${pn}/` : 'https://www.mcmaster.com/springs/';
    link.textContent = /^\d{4,5}[A-Z]\d{1,4}$/.test(pn) ? `${pn} on mcmaster.com` : 'the spring on mcmaster.com';
    $('#mmPaste').value = ''; $('#mmResult').innerHTML = ''; $('#mmUse').disabled = true; mmParsed = null;
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    $('#mmPaste').focus();
  }
  function closeImport() { if (dlg.open) dlg.close(); }
  function previewImport() {
    const r = McMaster.parse($('#mmPaste').value), out = $('#mmResult'); mmParsed = r; out.innerHTML = '';
    if (!$('#mmPaste').value.trim()) { $('#mmUse').disabled = true; return; }
    const esc = s => String(s).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
    out.append(h('div', { class: 'verdict ' + (r.ok ? 'ok' : 'bad'), html: r.ok ? `<b>${esc(r.pn || 'Spring')}</b>: ${esc(r.title || r.kind)}. Spring Bench can model this ${r.kind} spring.` : `<b>${esc(r.pn || 'Not imported')}</b>${r.title ? ': ' + esc(r.title) : ''}<br>${r.problems.map(esc).join('<br>')}` }));
    const keys = Object.entries(r.specs).filter(([k, v]) => typeof v === 'string');
    if (r.specs.Load) keys.push(['Load', `min ${r.specs.Load.Minimum || '—'}, max ${r.specs.Load.Maximum || '—'}`]);
    if (keys.length) { const t = h('table', { class: 'mmspecs' }); for (const [k, v] of keys) t.append(h('tr', {}, h('td', { text: k }), h('td', { text: v }))); out.append(t); }
    if (r.notes.length) out.append(h('ul', { class: 'mmnotes' }, ...r.notes.map(n => h('li', { text: n }))));
    $('#mmUse').disabled = !r.ok;
  }
  $('#mmPaste').addEventListener('input', previewImport);
  $('#mmCancel').addEventListener('click', closeImport); $('#mmClose').addEventListener('click', closeImport);
  $('#mmUse').addEventListener('click', () => {
    if (!mmParsed || !mmParsed.ok) return;
    edit(() => { model = Object.assign({}, mmParsed.model); }); stateT = 0.6; syncState(); draw();
    closeImport(); toast(`Imported McMaster ${mmParsed.pn}. Check F₁ and F₂ against your application.`);
  });

  // Read-only hook for tests.
  window.__springBench = { get model() { return JSON.parse(JSON.stringify(model)); }, get result() { return res; } };

  try { const s = localStorage.getItem(STORE_KEY); model = s ? JSON.parse(s) : null; } catch (e) { model = null; }
  if (!model || !model.type) model = Presets.list.smallReturn();
  new ResizeObserver(resize).observe(cv);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloads = d; }).catch(() => { downloads = null; });
  update();
})();

</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
